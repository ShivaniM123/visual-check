<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parity Check</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <header class="top">
    <img src="../icons/icon-32.png" alt="" width="22" height="22">
    <h1>Parity Check</h1>
    <button type="button" class="icon-btn" id="open-options" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.3 1.5l.4 2.2c.6.2 1.1.5 1.6.9l2.1-.8 1.3 2.3-1.7 1.4c.1.6.1 1.2 0 1.8l1.7 1.4-1.3 2.3-2.1-.8c-.5.4-1 .7-1.6.9l-.4 2.2H8.7l-.4-2.2c-.6-.2-1.1-.5-1.6-.9l-2.1.8-1.3-2.3L5 10.3c-.1-.6-.1-1.2 0-1.8L3.3 7.1l1.3-2.3 2.1.8c.5-.4 1-.7 1.6-.9l.4-2.2h2.6zM10 7a2.5 2.5 0 100 5 2.5 2.5 0 000-5z"/></svg>
    </button>
  </header>

  <main>
    <section class="card page-card" aria-labelledby="page-heading">
      <h2 id="page-heading" class="label">This page</h2>
      <p class="page-title" id="page-title">–</p>
      <p class="page-url" id="page-url"></p>

      <form id="check-form" novalidate>
        <label class="label" for="original-url">Original page</label>
        <input type="url" id="original-url" placeholder="https://www.example.com/the-same-page" autocomplete="off" spellcheck="false" required>
        <p class="hint" id="original-hint">Enter the original page once. Other pages on this site are then filled in for you.</p>
        <p class="hint width-line" id="width-line"></p>
        <button type="submit" class="btn primary" id="run-btn">Check this page</button>
      </form>
      <p class="blocked" id="blocked" hidden></p>
    </section>

    <section class="progress card" id="progress" hidden aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <p class="progress-step" id="progress-step">Starting</p>
        <p class="hint">A window with the original page opens for a few seconds, at the same width as this page.</p>
      </div>
    </section>

    <p class="error card" id="error" role="alert" hidden></p>

    <section id="results" hidden>
      <div class="card summary">
        <div class="score" id="score" aria-label="Parity score"><span id="score-num">–</span><small>/100</small></div>
        <div class="summary-body">
          <p class="summary-title">Parity score</p>
          <p class="hint" id="summary-stats"></p>
          <div class="chips" id="sev-chips" role="group" aria-label="Filter by severity"></div>
        </div>
      </div>
      <div id="notices"></div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-issues" aria-selected="true" aria-controls="view-issues">Visual parity <span class="count" id="count-issues"></span></button>
        <button type="button" role="tab" id="tab-lh" aria-selected="false" aria-controls="view-lh">Lighthouse <span class="count" id="count-lh"></span></button>
      </div>

      <div id="view-issues" role="tabpanel" aria-labelledby="tab-issues">
        <div class="list-tools">
          <label class="toggle"><input type="checkbox" id="show-pins" checked> Pins on page</label>
          <label class="toggle"><input type="checkbox" id="hide-approved"> Hide approved</label>
        </div>
        <ol class="issues" id="issues"></ol>
        <p class="hint keys">Keys: <kbd>←</kbd> <kbd>→</kbd> move · <kbd>A</kbd> approve · <kbd>F</kbd> needs fix</p>
      </div>

      <div id="view-lh" role="tabpanel" aria-labelledby="tab-lh" hidden>
        <div id="lh"></div>
      </div>
    </section>
  </main>

  <footer class="actions" id="actions" hidden>
    <button type="button" class="btn primary" id="copy-prompt">Copy for AEM Coder</button>
    <button type="button" class="btn" id="download">Download report</button>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
